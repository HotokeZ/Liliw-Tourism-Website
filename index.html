<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liliw, Laguna - The Footwear Capital of Laguna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 15px 20px;
            background-color: rgba(0, 0, 0, 0.3);
        }

        .header h3 {
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Main Content */
        .splash-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }

        .hero-text {
            text-align: left;
            margin-bottom: 30px;
            z-index: 2;
            animation: fadeInUp 1s ease;
        }

        .hero-text h1 {
            font-size: 72px;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .subtitle {
            display: flex;
            flex-direction: column;
            font-style: italic;
            margin-top: 20px;
        }

        .subtitle span {
            font-size: 32px;
            line-height: 1.3;
        }

        .subtitle .the {
            font-weight: 300;
        }

        .subtitle .footwear {
            font-weight: 600;
            font-size: 36px;
        }

        .subtitle .capital {
            font-weight: 300;
        }

        .subtitle .laguna {
            font-weight: 300;
        }

        .church-image {
            width: 100%;
            max-width: 500px;
            margin: 30px 0;
            position: relative;
            z-index: 1;
            animation: fadeIn 1.5s ease;
        }

        .church-image img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            object-fit: cover;
        }

        .arrow-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 3;
            text-decoration: none;
            animation: pulse 2s infinite;
        }

        .arrow-button span {
            font-size: 40px;
            color: #ffffff;
            transform: translateX(3px);
        }

        .arrow-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.8);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }
            50% {
                box-shadow: 0 0 0 20px rgba(255, 255, 255, 0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-text h1 {
                font-size: 48px;
            }

            .subtitle span {
                font-size: 24px;
            }

            .subtitle .footwear {
                font-size: 28px;
            }

            .arrow-button {
                width: 60px;
                height: 60px;
                bottom: 20px;
                right: 20px;
            }

            .arrow-button span {
                font-size: 32px;
            }
        }

        /* Extra small screens */
        @media (max-height: 600px) {
            .hero-text h1 {
                font-size: 36px;
            }

            .subtitle span {
                font-size: 18px;
            }

            .subtitle .footwear {
                font-size: 22px;
            }

            .church-image {
                max-width: 300px;
                margin: 15px 0;
            }

            .arrow-button {
                width: 50px;
                height: 50px;
                bottom: 15px;
                right: 15px;
            }

            .arrow-button span {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>MAIN</h3>
    </div>
    
    <div class="splash-content">
        <div class="hero-text">
            <h1>LILIW,</h1>
            <h1>LAGUNA</h1>
            <div class="subtitle">
                <span class="the">The</span>
                <span class="footwear">Footwear</span>
                <span class="capital">Capital of</span>
                <span class="laguna">Laguna</span>
            </div>
        </div>
        <div class="church-image">
            <img src="images/liliw-church.jpg" alt="Liliw Church" id="mainChurchImage">
        </div>
        <a href="homepage.html" class="arrow-button" id="goToHomepage">
            <span>→</span>
        </a>
    </div>
</body>
</html>
